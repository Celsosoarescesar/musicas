[project]
name = "reaper-copilot"
version = "0.1.0"
description = "Servidor MCP que deixa o Claude Code controlar o REAPER ao vivo via reapy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-reapy>=0.10.0",
    "mcp>=2.2.0",
    "music21>=10.5.0",
    "requests>=2.34.2",
    "python-dotenv>=1.2.3",
    "pyloudnorm>=0.2.0",
    "soundfile>=0.14.0",
    "kaggle>=2.2.4",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
